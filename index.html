<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI World Cuisine Recipe Generator</title>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI World Cuisine Recipe Generator</h1>
      </header>

      <main>
        <div class="form-container">
          <form id="recipe-generator-form">
            <input
              type="text"
              placeholder="Enter the topic of the world cuisine recipe"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="hint">i.e: Chicken Tikka Masala, Pad Thai or Sushi</div>
        </div>
        <div class="recipe hidden" id="recipe"></div>
      </main>

      <footer>
        This AI project was coded by
        <a href="https://github.com/linn-nay-chi-hlaing" target="_blank"
          >Linn Nay Chi Hlaing</a
        >
        and is
        <a
          href="https://github.com/linn-nay-chi-hlaing/SheCodes-Plus-AI-Week-2-LESSON-2"
          target="_blank"
          >open-sourced on GitHub</a
        >
        and is
        <a
          href="https://lnch-shecodes-plus-ai-week2.netlify.app/"
          target="_blank"
        >
          hosted on Netlify</a
        >
        .
      </footer>
    </div>
    <script src="src/app.js"></script>
  </body>
</html>
